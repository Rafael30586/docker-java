spring.application.name=microservicio-alimentos

# 1. Configuración de la conexión (DataSource)
spring.datasource.url=jdbc:mysql://alimentos-db:3306/alimentos?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Configuración de JPA / Hibernate
# 'update' crea las tablas automáticamente o las actualiza sin borrar datos previos
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en la consola (útil para desarrollo)
spring.jpa.show-sql=true
# Dialecto específico para MySQL 8 o superior
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

