

services: 
  microservicio-alimentos-p-6:
    build: microservicio-alimentos/
    ports:
      - "8080:8080"
    depends_on:
      alimentos_db:
        condition: service_healthy
  microservicio-marca-p-6:
    build: microservicio-marcas/
    ports:
      - "8081:8080"
    depends_on:
      marcas_db:
        condition: service_healthy
  microservicio-clasificacion-p-6:
    build: microservicio-clasificaciones/
    ports:
      - "8082:8080"
    depends_on:
      clasificaciones_db:
        condition: service_healthy
  alimentos_db:
    container_name: alimentos_db
    image: mysql:8.3.0
    restart: always
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=alimentos
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p123456 -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
  marcas_db:
    container_name: marcas_db
    image: mysql:8.3.0
    restart: always
    ports:
      - "3308:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=marcas_alimentos
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p123456 -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
  clasificaciones_db:
    container_name: clasificaciones_db
    image: mysql:8.3.0
    restart: always
    ports:
      - "3309:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=clasificacion_alimentos
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -p123456 -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20


